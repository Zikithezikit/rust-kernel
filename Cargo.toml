[package]
name = "rust-kernel"
version = "0.1.0"
edition = "2021"
authors = ["Zikithezikit zikithezikit@gmail.com"]
description = "A simple x86_64 kernel written in Rust."


[dependencies]
x86_64 = "0.15.2"
spin = "0.10.0"
pc-keyboard = "0.8.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
default = []

[lib]
path = "src/implementation/kernel/main.rs"
crate-type = ["staticlib"]

[build-dependencies]

[workspace]
